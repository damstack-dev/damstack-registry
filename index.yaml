# The stacks of the registry, as damstack lists them. scripts/index writes it
# from their damstack.yaml; CI fails when it is not up to date.
stacks:
- name: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: platforms/hashi
  description: Consul, Vault and Nomad on one server, their admin pages over WireGuard, with backups, a platform for apps such as mail
  provides:
  - nomad@1
  - vault-kv@1
  - consul@1
  - ingress-internal@1
  - observability@1
  recommended: true
- name: grafana
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/grafana
  description: Grafana for the platform, with the metrics and logs of the project as data sources
  requires:
  - ingress-internal@1
  uses:
  - metrics@1
  - logs@1
- name: loki
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/loki
  description: A shared Loki log store other apps and the platform's collector push to
  provides:
  - logs@1
- name: mail
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/mail
  description: Mail for your domains, by Stalwart, with its DNS records, on a Nomad platform such as hashi
  requires:
  - ingress-public@1
  - public-dns@1
- name: mimir
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/mimir
  description: A shared Mimir metric store the platform collector remote_writes to
  provides:
  - metrics@1
- name: nats
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/nats
  description: A shared NATS (JetStream) bus other apps publish and subscribe on
  provides:
  - nats@2
- name: odoo
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/odoo
  description: Odoo with its PostgreSQL, on a Nomad platform such as hashi
  requires:
  - ingress-public@1
  - public-dns@1
  - capability: postgres@16
    when: postgres.mode=external
- name: postgres
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/postgres
  description: A shared PostgreSQL other apps use when they set postgres.mode external
  provides:
  - postgres@16
- name: seaweedfs
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/seaweedfs
  description: A shared SeaweedFS object lake with an S3 API other apps read and write
  provides:
  - s3@1
- name: traefik
  kind: app
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: apps/traefik
  description: The public entry of the project, Traefik on ports 80 and 443 with certificates from Let's Encrypt, on a Nomad platform such as hashi
  provides:
  - ingress-public@1
  - tls-certificates@1
- name: cloudflare
  kind: domain
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: domains/cloudflare
  description: Your domains on Cloudflare, damstack publishes the DNS records the apps need
  provides:
  - public-dns@1
  recommended: true
- name: manual
  kind: domain
  platform: hashi
  url: https://github.com/damstack-dev/damstack-registry
  path: domains/manual
  description: Your domains anywhere, you add the DNS records the apps need by hand and damstack checks they are there
  provides:
  - public-dns@1
