apiVersion: damstack/v2
name: postgres
kind: app
description: A shared PostgreSQL other apps use when they set postgres.mode external
requires:
  damstack: ">=0.8.0"
  toolbox: ">=1.1.0, <2.0.0"
  provides: [nomad, vault-kv]

config: template/postgres.yaml.tmpl
done:
  - "PostgreSQL answers inside the platform as the Consul service postgres."
  - "The superuser password: damstack postgres output admin_password"
  - "A consumer app (e.g. odoo with postgres.mode external) points at it and makes its own database."

targets:
  nomad:
    steps:
      - name: apply
        title: The shared PostgreSQL
        takes: 2 min
        tofu:
          dir: infra
          action: apply
          policy: &policy {dir: policy}
        tunnel: true
        confirm: true
    commands:
      plan:
        tofu: {dir: infra, action: plan, policy: *policy}
        tunnel: true
      output:
        tofu: {dir: infra, action: output}

check:
  answers: test/answers.yaml
  platform: test/platform.yaml
  steps:
    - name: outputs
      run:
        - sh
        - -c
        - >-
          cd "$DAMSTACK_STACK/infra" && export TF_DATA_DIR="$DAMSTACK_PROJECT/.damstack/work/tofu-test" TF_VAR_project="$DAMSTACK_PROJECT" &&
          tofu init -backend=false -input=false -lockfile=readonly >/dev/null && tofu test -no-color
