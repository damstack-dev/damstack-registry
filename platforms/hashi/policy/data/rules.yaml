rules:
  public_host_network: public
  allowed_caps:
    - net_bind_service
  protected_types:
    - vault_mount
    - vault_kv_secret_v2
    - nomad_dynamic_host_volume
    - nomad_csi_volume
  # The DNS token of the Traefik of hashi before v1.0.0, which no longer asks one.
  allow_destroy:
    - module.stack.module.traefik.vault_kv_secret_v2.acme
